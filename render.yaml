# Render Blueprint - WhosRunningUSA
# https://render.com/docs/blueprint-spec

# NOTE ON region: every resource that talks to the database is pinned to the
# SAME region below. Render's internal database hostname (dpg-…-a) only
# resolves to services in the same region, so a region mismatch shows up as
# `getaddrinfo ENOTFOUND`. region is set at CREATION and cannot be changed on
# an existing resource — if your dashboard shows these already live in a
# different region (e.g. virginia/ohio/frankfurt/singapore), change ALL of the
# `region:` values below to match it rather than the reverse.
databases:
  - name: whosrunningusa-db
    plan: free
    region: oregon
    databaseName: whosrunningusa
    postgresMajorVersion: 16


services:
  # Backend API
  - type: web
    name: whosrunningusa-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    # Install backend + root deps so /admin/trigger-sync can spawn
    # root-dir scripts (compute-rubber-stamp, sync-foreign-aid, etc.)
    # that require top-level packages like 'pg' at runtime.
    buildCommand: npm install && cd .. && npm install --omit=dev && cd backend
    startCommand: node scripts/migrate.js && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whosrunningusa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://whosrunningusa.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: noreply@whosrunningusa.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: OPEN_STATES_API_KEY
        sync: false
      - key: FEC_API_KEY
        sync: false
      - key: CONGRESS_GOV_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # Frontend Static Site
  - type: web
    name: whosrunningusa
    runtime: static
    buildCommand: npm install && VITE_API_URL=$VITE_API_URL npm run build:all
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://whosrunningusa-api.onrender.com https://plausible.io"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://whosrunningusa-api.onrender.com/api

  # =========================================
  # CRON JOBS
  # =========================================

  # Daily Data Sync — runs all ingestion scripts at 2 AM UTC
  - type: cron
    name: whosrunningusa-sync
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && cd .. && npm install --omit=dev && cd backend
    schedule: "0 2 * * *"
    startCommand: node scripts/migrate.js && node scripts/sync-scheduler.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whosrunningusa-db
          property: connectionString
      - key: FEC_API_KEY
        sync: false
      - key: OPEN_STATES_API_KEY
        sync: false
      - key: CONGRESS_GOV_API_KEY
        sync: false
      - key: VOTE_SMART_API_KEY
        sync: false
      - key: SYNC_FEC_CYCLE
        value: "2026"
      - key: OPENSECRETS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Daily Database Backup — runs at 4 AM UTC
  - type: cron
    name: whosrunningusa-backup
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install
    schedule: "0 4 * * *"
    startCommand: node scripts/migrate.js && node scripts/backup.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whosrunningusa-db
          property: connectionString
      - key: BACKUP_RETAIN_COUNT
        value: "7"
      # Off-site backups are ON. The free Postgres tier expires and the cron's
      # local disk is ephemeral, so without S3 there is NO recoverable backup.
      # For uploads to actually run you MUST set these three secrets in the
      # Render dashboard for this cron (they're sync:false = dashboard-only):
      #   S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      # Until they're set, backup.js logs a warning and skips the upload
      # (it does not crash).
      - key: BACKUP_S3_ENABLED
        value: "true"
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1

