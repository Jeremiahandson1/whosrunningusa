name: Keep API Warm

# Render free tier spins down after ~15 min of inactivity, causing cold-start 503s
# on the next request. Pinging /api/health every 10 min keeps the instance awake.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          URL="${API_URL:-https://whosrunningusa-api.onrender.com}/api/health"
          echo "Pinging $URL"
          for i in 1 2 3; do
            STATUS=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              cat /tmp/body
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 3 attempts"
          cat /tmp/body || true
          exit 1
        env:
          API_URL: ${{ secrets.API_URL }}
